<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyVault Game Keys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Tokens mirror the Figma "Semantic" + "Spacing & Radius" collections */
:root{
  color-scheme:dark;
  --bg-base:#0b0d12;--bg-surface:#12151c;--bg-elevated:#1a1e28;--bg-hover:#232836;
  --border-default:#262b38;--border-strong:#3a4152;--border-flag:rgba(255,255,255,.12);
  --text-primary:#f2f4f8;--text-secondary:#a3a9b8;--text-tertiary:#6b7285;--text-on-accent:#fff;--text-on-media-muted:rgba(255,255,255,.7);
  --accent-primary:#7c5cff;--accent-hover:#9378ff;--accent-subtle:#231c47;--accent-text:#b4a3ff;--accent-glow:rgba(124,92,255,.35);
  --status-discount:#3ddc84;--status-discount-text:#06210f;
  --overlay-on-media:rgba(11,13,18,.55);--overlay-on-media-hover:rgba(11,13,18,.8);--overlay-scrim:rgba(0,0,0,.5);--overlay-scrim-strong:rgba(0,0,0,.6);
  --space-2:2px;--space-4:4px;--space-8:8px;--space-12:12px;--space-16:16px;--space-20:20px;--space-24:24px;--space-32:32px;--space-40:40px;--space-48:48px;--space-64:64px;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-full:999px;
  --elev-menu:0 12px 32px rgba(0,0,0,.4);--elev-dropdown:0 16px 48px rgba(0,0,0,.45);--elev-glow:0 12px 32px rgba(124,92,255,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg-base);color:var(--text-primary);font:400 14px/20px Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;flex:none;display:block}
img{display:block}
:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px;border-radius:var(--radius-sm)}
.wrap{max-width:1440px;margin:0 auto;padding:0 48px}

/* ---------- Header ---------- */
.hdr{background:var(--bg-base);position:sticky;top:0;z-index:40}
.top{height:72px;border-bottom:1px solid var(--border-default)}
.top .wrap{height:100%;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:.02em;flex:none}
.logo b{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--accent-primary);display:grid;place-items:center;color:#fff}
.field{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-sm);color:var(--text-tertiary);transition:border-color .15s}
.field:focus-within{border-color:var(--accent-primary)}
.field input{flex:1;min-width:0;color:var(--text-primary);font-size:16px;line-height:24px}
.field input::placeholder{color:var(--text-tertiary)}
.top .field{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:40px;padding:0 12px;border-radius:var(--radius-sm);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;position:relative}
.btn-sec{background:var(--bg-surface);border:1px solid var(--border-default)}
.btn-sec:hover{background:var(--bg-elevated);border-color:var(--border-strong)}
.btn-pri{background:var(--accent-primary);color:var(--text-on-accent)}
.btn-pri:hover{background:var(--accent-hover)}
.btn-ghost{color:var(--text-secondary)}.btn-ghost:hover{color:var(--text-primary);background:var(--bg-elevated)}
.ib{width:40px;padding:0}
.counter{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-full);background:var(--accent-primary);color:#fff;font:600 12px/20px Geist,system-ui,sans-serif;text-align:center}
.btn-pri .counter{background:#fff;color:var(--accent-primary)}
.counter[hidden]{display:none}
.region-btn .flag{margin-right:4px}
.nav{height:48px;border-bottom:1px solid var(--border-default)}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}
.nav ul{display:flex;list-style:none;gap:4px;margin-left:-12px}
.nav-i{height:40px;padding:0 12px;display:flex;align-items:center;gap:4px;border-radius:var(--radius-sm);color:var(--text-secondary);font-weight:500}
.nav-i:first-child{}
.nav-i:hover,.nav-i[aria-expanded=true]{color:var(--text-primary);background:var(--bg-elevated)}
.nav-i.on{color:var(--text-primary)}
.nav-i svg{width:16px;height:16px;transition:transform .15s}
.nav-i[aria-expanded=true] svg{transform:rotate(180deg)}
.nav .links{display:flex;gap:24px;color:var(--text-secondary);font-weight:500}
.nav .links a:hover{color:var(--text-primary)}
.mega{position:absolute;left:40px;top:128px;width:992px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--elev-dropdown);padding:24px;display:none;grid-template-columns:200px 200px 200px 248px;gap:32px;z-index:50}
.mega.open{display:grid}
.mega h6{font:600 12px/16px Geist,system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:12px}
.mega a{display:flex;align-items:center;gap:4px;height:40px;padding:0 8px;margin:0 -8px;border-radius:var(--radius-sm);color:var(--text-primary)}
.mega a:hover{background:var(--bg-elevated)}
.mega a .ct{margin-left:auto;color:var(--text-tertiary);font-size:12px}
.mega a img,.mega a svg{width:20px;height:20px}
.promo{position:relative;border-radius:var(--radius-md);overflow:hidden;height:280px;background:center/cover}
.promo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(11,13,18,.75))}
.promo div{position:absolute;left:20px;right:20px;bottom:24px;z-index:1}
.promo small{font:500 12px/16px Geist,system-ui,sans-serif;color:var(--text-on-media-muted);text-transform:uppercase}
.promo strong{display:block;font:700 28px/32px Geist,system-ui,sans-serif;letter-spacing:-.5px}
.pop{position:absolute;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--elev-menu);padding:8px;z-index:60;display:none;min-width:240px}
.pop.open{display:block}
.mi{display:flex;align-items:center;gap:4px;width:100%;height:40px;padding:0 8px;border-radius:var(--radius-sm);color:var(--text-secondary);text-align:left}
.mi:hover{background:var(--bg-elevated);color:var(--text-primary)}
.mi.on{color:var(--accent-text)}
.mi .chk{margin-left:auto;color:var(--accent-text);visibility:hidden}
.mi.on .chk{visibility:visible}
.flag{width:24px;height:16px;border-radius:4px;flex:none}

/* ---------- Page ---------- */
main{padding:24px 0 64px}
.crumbs{display:flex;align-items:center;gap:4px;color:var(--text-tertiary);font-size:14px}
.crumbs svg{width:16px;height:16px}
.crumbs span:last-child{color:var(--text-primary)}
.crumbs a:hover{color:var(--text-primary)}
.ttl{display:flex;align-items:baseline;gap:12px;margin:16px 0 24px}
h1{font:700 32px/40px Geist,system-ui,sans-serif;letter-spacing:-.5px}
.ttl small{color:var(--text-tertiary);font-size:16px}
.layout{display:grid;grid-template-columns:264px 1fr;gap:24px;align-items:start}

/* Filters */
.panel{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);position:sticky;top:136px;max-height:calc(100vh - 152px);overflow:auto;scrollbar-width:thin}
.panel-h{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;border-bottom:1px solid var(--border-default)}
.panel-h h2{font:600 20px/28px Geist,system-ui,sans-serif}
.grp{border-bottom:1px solid var(--border-default);padding:0 16px}
.grp:last-child{border-bottom:0}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;height:56px;font:500 16px/24px Geist,system-ui,sans-serif;text-align:left}
.grp-h .n{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-full);background:var(--accent-subtle);color:var(--accent-text);font:600 12px/20px Geist,system-ui,sans-serif;text-align:center}
.grp-h .chev{margin-left:auto;color:var(--text-secondary);transition:transform .15s}
.grp-h .n~.chev{margin-left:0}
.grp.open .grp-h .chev{transform:rotate(180deg)}
.grp-b{display:none;padding-bottom:16px}
.grp.open .grp-b{display:block}
.grp .field{height:40px;margin-bottom:12px}
.grp .field input{font-size:14px}
.opt{display:flex;align-items:center;gap:12px;height:36px;cursor:pointer;color:var(--text-primary)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none;color:#fff;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0}
.opt input:checked+.box{background:var(--accent-primary);border-color:var(--accent-primary)}
.opt input:checked+.box svg{opacity:1}
.opt input:focus-visible+.box{outline:2px solid var(--accent-primary);outline-offset:2px}
.opt .lab{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.opt .lab img{width:20px;height:20px}
.opt .lab img.flag{width:24px;height:16px}
.opt .lab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .ct{color:var(--text-tertiary);font-size:12px}
.opt:hover .box{border-color:var(--text-secondary)}
.link{display:inline-flex;align-items:center;gap:4px;color:var(--accent-text);font-weight:500;margin-top:8px}
.link svg{width:16px;height:16px;transition:transform .15s}
.link[aria-expanded=true] svg{transform:rotate(180deg)}
.nores{color:var(--text-tertiary);padding:8px 0}
.range{position:relative;height:24px;margin:4px 0 16px}
.range .trk{position:absolute;left:8px;right:8px;top:10px;height:4px;border-radius:2px;background:var(--border-default)}
.range .fill{position:absolute;top:10px;height:4px;background:var(--accent-primary);border-radius:2px}
.range input{position:absolute;inset:0;width:100%;-webkit-appearance:none;appearance:none;background:none;pointer-events:none}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--accent-primary);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:8px;height:8px;border-radius:50%;background:#fff;border:4px solid var(--accent-primary);cursor:grab}
.prices{display:flex;align-items:center;gap:8px}
.prices .field{height:40px;flex:1;margin:0;min-width:0}
.prices .field input{width:100%}
.prices .field input{font-size:14px}
.prices i{color:var(--text-tertiary);font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{height:32px;padding:0 12px;border-radius:var(--radius-full);background:var(--bg-elevated);border:1px solid var(--border-default);color:var(--text-secondary);font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip:hover{color:var(--text-primary);border-color:var(--border-strong)}
.chip.on{background:var(--accent-subtle);border-color:var(--accent-primary);color:var(--text-primary)}
.chip svg{width:16px;height:16px}
.sw{display:flex;align-items:center;justify-content:space-between;height:32px;color:var(--text-secondary);cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw .t{width:36px;height:20px;border-radius:10px;background:var(--border-strong);position:relative;transition:background .15s}
.sw .t:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--text-secondary);transition:transform .15s,background .15s}
.sw input:checked+.t{background:var(--accent-primary)}
.sw input:checked+.t:after{transform:translateX(16px);background:#fff}
.sw input:focus-visible+.t{outline:2px solid var(--accent-primary);outline-offset:2px}
.toggles{padding:16px}

/* Toolbar */
.bar{display:flex;gap:12px}
.bar .field{flex:1}
.sortb{height:48px;padding:0 12px}
.sortb .k{color:var(--text-tertiary);font-weight:400}
.seg{display:flex;padding:3px;gap:4px;height:48px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-sm)}
.seg button{width:40px;border-radius:6px;color:var(--text-tertiary);display:grid;place-items:center}
.seg button.on{background:var(--bg-elevated);color:var(--text-primary)}
.seg button:hover{color:var(--text-primary)}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin:16px 0}
.meta .found{color:var(--text-secondary)}.meta .found b{color:var(--text-primary);font-weight:500}
.meta .chips{margin:0;gap:8px}
.ach{height:32px;padding:0 8px 0 12px;border-radius:var(--radius-full);background:var(--bg-elevated);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ach svg{width:16px;height:16px;color:var(--text-secondary)}
.ach:hover svg{color:var(--text-primary)}
.clear{color:var(--text-secondary);font-weight:500}.clear:hover{color:var(--text-primary)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{position:relative;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--accent-primary);box-shadow:var(--elev-glow)}
.cv{position:relative;aspect-ratio:252/144;background:var(--bg-elevated) center/cover}
.cv img{width:100%;height:100%;object-fit:cover}
.wish{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:var(--radius-sm);background:var(--overlay-on-media);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .15s,background .15s}
.wish svg{width:20px;height:20px}
.card:hover .wish,.wish.on,.wish:focus-visible{opacity:1}
.wish:hover{background:var(--overlay-on-media-hover)}
.wish.on svg path{fill:#fff}
.cb{padding:16px 16px 12px;display:flex;flex-direction:column;gap:16px;flex:1}
.cb h3{font:500 16px/24px Geist,system-ui,sans-serif;min-height:48px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plat{display:flex;align-items:center;gap:8px;height:20px}
.plat img{width:20px;height:20px}
.plat .sep{width:1px;height:16px;background:var(--border-default)}
.plat .dv{display:flex;gap:8px}
.foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding:0 16px 16px}
.price{font:700 20px/28px Geist,system-ui,sans-serif;letter-spacing:-.2px}
.cart{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-elevated);display:grid;place-items:center;color:var(--text-secondary);transition:all .15s}
.card:hover .cart{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff}
.cart.added{background:var(--accent-subtle);border-color:var(--accent-primary);color:var(--accent-text)}
.card .sub{display:none}
.card .buy{display:none}
/* List view */
.grid.list{grid-template-columns:1fr;gap:12px}
.list .card{flex-direction:row;align-items:center;padding:12px;gap:20px}
.list .cv{width:168px;flex:none;border-radius:var(--radius-sm);overflow:hidden}
.list .cb{padding:0;gap:8px;flex:1}
.list .cb h3{min-height:0;-webkit-line-clamp:1}
.list .card .sub{display:block;color:var(--text-tertiary)}
.list .foot{margin:0;padding:0;align-items:center;gap:12px;flex:none;padding-right:8px}
.list .price{margin-right:12px}
.list .wish{position:static;opacity:1;background:var(--bg-elevated);border:1px solid var(--border-default);width:40px;height:40px;backdrop-filter:none;color:var(--text-secondary)}
.list .wish.on{color:#fff}
.list .cv .wish{display:none}
.list .cart{display:none}
.list .card .buy{display:inline-flex}
.list .card:hover .buy{background:var(--accent-hover)}
.card .lw{display:none}.list .card .lw{display:grid}

.empty{grid-column:1/-1;text-align:center;padding:64px 16px;border:1px dashed var(--border-strong);border-radius:var(--radius-md);color:var(--text-secondary)}
.empty h3{font:600 20px/28px Geist,system-ui,sans-serif;color:var(--text-primary);margin-bottom:8px}
.empty .btn{margin-top:16px}

/* Pagination */
.pg{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:40px}
.pg .vw{color:var(--text-secondary)}
.pg .pr{width:240px;height:4px;border-radius:2px;background:var(--border-default);overflow:hidden}
.pg .pr i{display:block;height:100%;background:var(--accent-primary);border-radius:2px;min-width:8px}
.pages{display:flex;gap:8px;margin-top:12px}
.pages button{min-width:40px;height:40px;padding:0 8px;border-radius:var(--radius-sm);background:var(--bg-surface);color:var(--text-secondary);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.pages button:hover:not(:disabled){background:var(--bg-elevated);color:var(--text-primary)}
.pages button.on{background:var(--accent-primary);color:#fff}
.pages button:disabled{opacity:.4;cursor:default}
.pages .dots{min-width:24px;display:grid;place-items:center;color:var(--text-tertiary)}
.pages .lbl{padding:0 12px}

footer{background:var(--bg-surface);border-top:1px solid var(--border-default)}
footer .wrap{height:84px;display:flex;align-items:center;justify-content:space-between;color:var(--text-secondary)}
footer nav{display:flex;gap:24px;color:var(--text-primary)}
footer nav a:hover{color:var(--accent-text)}

/* Mobile-only parts */
.m-only{display:none}
.scrim{position:fixed;inset:0;background:var(--overlay-scrim-strong);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:var(--bg-surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:90;transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:8px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 12px;border-bottom:1px solid var(--border-default)}
.sheet-h h2{font:700 20px/28px Geist,system-ui,sans-serif}
.sheet-b{overflow:auto;flex:1;padding:0 8px}
.sheet-f{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border-default)}
.sheet-f .btn{height:48px;font-size:16px}
.sheet-f .btn-pri{flex:1}
.ropt{display:flex;align-items:center;gap:12px;height:48px;padding:0 8px;border-radius:var(--radius-sm);width:100%;font-size:16px;text-align:left}
.ropt .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;display:grid;place-items:center}
.ropt.on{background:var(--bg-elevated)}
.ropt.on .rd{border:6px solid var(--accent-primary);background:#fff}
.ropt svg{color:var(--text-secondary)}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--bg-surface);z-index:90;transform:translateX(-100%);transition:transform .25s;padding:16px;display:flex;flex-direction:column;gap:4px}
.drawer.open{transform:none}
.drawer a{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 8px;border-radius:var(--radius-sm);font-size:16px;font-weight:500}
.drawer a:hover{background:var(--bg-elevated)}
.drawer hr{border:0;border-top:1px solid var(--border-default);margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);background:var(--bg-elevated);border:1px solid var(--border-strong);padding:12px 16px;border-radius:var(--radius-md);box-shadow:var(--elev-menu);opacity:0;transition:all .2s;z-index:100;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1279px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .mega{width:auto;right:40px;grid-template-columns:repeat(3,1fr)}
  .mega .promo{display:none}
}
@media (max-width:1023px){
  .wrap{padding:0 16px}
  .d-only{display:none!important}
  .m-only{display:flex}
  .top{height:56px}
  .top .wrap{gap:8px}
  .top .logo{margin-right:auto}
  .layout{grid-template-columns:1fr}
  main{padding:24px 0 40px}
  .crumbs{display:none}

  <div class="chips">${PRESETS.map(([x,y])=>`<button class="chip ${a===x&&b===y?'on':''}" data-preset="${x}-${y}">€${x}–${y}</button>`).join('')}</div>`}
function filtersHTML(ctx){const order=ctx==='desk'?DESK_ORDER:MOB_ORDER;
  return order.map(g=>{const open=S.open[ctx][g], n=g==='price'?0:S.sel[g].size, t=g==='price'?'Price':GROUPS[g].t;
    return `<div class="grp ${open?'open':''}" data-grp="${g}"><button class="grp-h" data-tog="${g}" aria-expanded="${!!open}">${t}${n?`<span class="n">${n}</span>`:''}<svg class="i chev" viewBox="0 0 20 20" fill="none">${ICONS['chevron-down']}</svg></button><div class="grp-b">${open?(g==='price'?priceBody():groupBody(g,ctx)):''}</div></div>`}).join('')
  +`<div class="toggles"><label class="sw">Only discounted<input type="checkbox" data-sw="disc" ${S.disc?'checked':''}><span class="t"></span></label><label class="sw">Instant delivery<input type="checkbox" data-sw="instant" ${S.instant?'checked':''}><span class="t"></span></label></div>`}
function renderFilters(keepFocus){
  const f=document.activeElement, key=f&&f.dataset&&(f.dataset.fq||f.dataset.p), pos=f&&f.selectionStart;
  $('#fDesk').innerHTML=filtersHTML('desk'); $('#fMob').innerHTML=filtersHTML('mob');
  if(key){const el=document.querySelector(`[data-fq="${key}"],[data-p="${key}"]`); const inSheet=f.closest('#fMob');
    const t=[...document.querySelectorAll(`[data-fq="${key}"],[data-p="${key}"]`)].find(e=>!!e.closest('#fMob')===!!inSheet)||el; if(t){t.focus();try{t.setSelectionRange(pos,pos)}catch(e){}}}
}

/* ---------- Results ---------- */
function filtered(){
  let list=GAMES.filter(g=>{
    if(S.sel.device.size&&!( (S.sel.device.has('pc')) || (S.sel.device.has('xbox')&&g.xbox) )) return false;
    if(S.sel.platform.size&&!S.sel.platform.has(g.act)) return false;
    if(S.sel.publisher.size&&!S.sel.publisher.has(g.pub)) return false;
    if(g.price<S.price[0]||g.price>S.price[1]) return false;
    if(S.q&&!g.title.toLowerCase().includes(S.q.toLowerCase())) return false;
    if(S.disc) return false;
    return true});
  const by={asc:(a,b)=>a.price-b.price,desc:(a,b)=>b.price-a.price,az:(a,b)=>a.title.localeCompare(b.title),new:(a,b)=>b.id%5-a.id%5||a.id-b.id};
  if(by[S.sort]) list=[...list].sort(by[S.sort]);
  return list}
function foundCount(list){
  if(!list.length) return 0;
  const sum=(g)=>[...S.sel[g]].reduce((s,v)=>s+((GROUPS[g].opts.find(o=>o[0]===v)||[])[2]||0),0);
  let n=S.sel.region.size?sum('region'):TOTAL; if(!n) n=TOTAL;
  for(const g of ['device','platform']) if(S.sel[g].size){const s=sum(g); if(s) n=Math.min(n,s)}
  const narrowed=S.q||S.price[0]>0||S.price[1]<PMAX||S.sel.publisher.size||S.sel.genre.size||S.sel.type.size||S.instant;
  return narrowed?list.length:Math.max(n,list.length)}
const ACT_ICON={steam:'steam',gog:'gog',microsoft:'microsoft'};
function cardHTML(g){const w=S.wish.has(g.id), c=S.cart.has(g.id);
  return `<article class="card"><div class="cv"><img src="${g.cover}" alt="${g.title} cover" loading="lazy"><button class="wish ${w?'on':''}" data-wish="${g.id}" aria-pressed="${w}" aria-label="Add ${g.title} to wishlist">${ic('heart')}</button></div>
  <div class="cb"><h3>${g.title}</h3><div class="plat" aria-label="Activation and devices">${img(ACT_ICON[g.act])}<span class="sep"></span><span class="dv">${img('dev-pc')}${g.xbox?img('dev-xbox'):''}</span></div><span class="sub">Digital key · Instant delivery</span></div>
  <div class="foot"><span class="price">€${g.price.toFixed(2)}</span><button class="wish lw ${w?'on':''}" data-wish="${g.id}" aria-pressed="${w}" aria-label="Add ${g.title} to wishlist">${ic('heart')}</button><button class="cart ${c?'added':''}" data-cart="${g.id}" aria-label="Add ${g.title} to cart">${ic(c?'check':'cart')}</button><button class="btn btn-pri buy" data-cart="${g.id}">${c?'In cart':'Buy now'}</button></div></article>`}
function pagesHTML(total){const pages=Math.max(1,Math.ceil(total/16)), p=Math.min(S.page,pages), mob=innerWidth<1024;
  const nums=[]; const win=mob?3:4;
  if(pages<=win+2){for(let i=1;i<=pages;i++)nums.push(i)} else {
    let s=Math.max(1,Math.min(p-1,pages-win)); if(p<=2)s=1;
    if(s>1)nums.push(1); if(s>2)nums.push('…'); for(let i=s;i<s+win&&i<=pages;i++)nums.push(i); if(s+win<pages)nums.push('…'); if(nums[nums.length-1]!==pages)nums.push(pages)}
  const viewed=Math.min(total,p*16);
  return `<span class="vw">You’ve viewed ${fmt(viewed)} of ${fmt(total)} games</span><div class="pr"><i style="width:${Math.max(2,viewed/total*100)}%"></i></div>
  <div class="pages"><button class="lbl" data-page="${p-1}" ${p===1?'disabled':''} aria-label="Previous page">${ic('chevron-left','style="width:16px;height:16px"')}<span>Prev</span></button>
  ${nums.map(n=>n==='…'?'<span class="dots">…</span>':`<button data-page="${n}" class="${n===p?'on':''}" ${n===p?'aria-current="page"':''}>${fmt(n)}</button>`).join('')}
  <button class="lbl" data-page="${p+1}" ${p===pages?'disabled':''} aria-label="Next page"><span>Next</span>${ic('chevron-right','style="width:16px;height:16px"')}</button></div>`}
function activeChips(){const out=[];
  for(const g in S.sel) for(const v of S.sel[g]){const o=GROUPS[g].opts.find(x=>x[0]===v); out.push([`${g}:${v}`,o[1]])}
  if(S.price[0]>0||S.price[1]<PMAX) out.push(['price',`€${S.price[0]}–${S.price[1]}`]);
  if(S.disc) out.push(['sw:disc','Discounted']); if(S.instant) out.push(['sw:instant','Instant delivery']);
  return out}
function render(){
  const list=filtered(), total=foundCount(list);
  const rot=(S.page-1)%list.length||0; const shown=list.length?[...list.slice(rot),...list.slice(0,rot)]:[];
  const grid=$('#grid'); grid.className='grid'+(S.view==='list'?' list':'');
  grid.innerHTML=shown.length?shown.map(cardHTML).join(''):`<div class="empty"><h3>No games match these filters</h3><p>Try widening the price range or removing a filter.</p><button class="btn btn-pri" data-act="reset">Reset filters</button></div>`;
  $('#pg').innerHTML=total?pagesHTML(total):''; $('#pg').style.display=total?'':'none';
  $('#found').textContent=fmt(total);
  $('#showBtn').textContent=total?`Show ${fmt(total)} games`:'No games found';
  const ch=activeChips();
  $('#active').innerHTML=ch.map(([k,l])=>`<button class="ach" data-rm="${k}">${l}${ic('close')}</button>`).join('')+(ch.length?'<button class="clear" data-act="reset">Clear all</button>':'');
  const fc=ch.length; $('#fCt').textContent=fc; $('#fCt').hidden=!fc;
  $$('.sortLbl').forEach(e=>e.textContent=SORTS.find(s=>s[0]===S.sort)[1]);
  $('#sortPop').innerHTML=SORTS.map(([v,l,i])=>`<button class="mi ${S.sort===v?'on':''}" data-sort="${v}" role="menuitemradio" aria-checked="${S.sort===v}">${ic(i)}${l}${ic('check','class="i chk"')}</button>`).join('');
  $('#sMob').innerHTML=SORTS.map(([v,l,i])=>`<button class="ropt ${S.sort===v?'on':''}" data-sort="${v}" role="radio" aria-checked="${S.sort===v}"><span class="rd"></span>${ic(i)}${l}</button>`).join('');
  $$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  $('#mView').innerHTML=ic(S.view==='grid'?'list':'grid');
  $('#cartCt').textContent=S.cart.size; $('#cartCt').hidden=!S.cart.size;
  $('#wishCt').textContent=S.wish.size; $('#wishCt').hidden=!S.wish.size;
}
function update(){S.page=1;renderFilters();render()}

/* ---------- Header menus ---------- */
const NAV=[['Game keys',1],['Gift cards',['Steam Wallet','PlayStation Store','Xbox gift cards','Nintendo eShop']],['Software',['Windows','Office','Antivirus','VPN']],['Subscriptions',['Xbox Game Pass','PlayStation Plus','EA Play','Nintendo Switch Online']],['Top-up',['Mobile games','In-game currency']],['Deals',0]];
$('#navList').innerHTML=NAV.map(([l,k],i)=>`<li><button class="nav-i ${i===0?'on':''}" data-nav="${i}" ${k?'aria-haspopup="true" aria-expanded="false"':''}>${l}${k?ic('chevron-down'):''}</button></li>`).join('');
$('#mega').innerHTML=`<div><h6>By activation platform</h6>${[['steam','Steam',26697],['ea','EA app',227],['ubisoft','Ubisoft Connect',189],['gog','GOG',363],['epic','Epic Games',91],['battlenet','Battle.net',28]].map(([i,l,c])=>`<a href="#">${img(i)}${l}<span class="ct">${fmt(c)}</span></a>`).join('')}</div>
<div><h6>By device</h6>${[['dev-pc','PC'],['dev-ps','PlayStation'],['dev-xbox','Xbox'],['dev-switch','Nintendo Switch']].map(([i,l])=>`<a href="#">${img(i)}${l}</a>`).join('')}</div>
<div><h6>Collections</h6>${[['flame','Bestsellers'],['sparkle','New releases'],['percent','Random keys'],['bolt','Pre-orders'],['globe','Global keys']].map(([i,l])=>`<a href="#" style="color:var(--text-primary)">${ic(i,'style="color:var(--text-secondary)"')}${l}</a>`).join('')}</div>
<a class="promo" href="#" style="background-image:url(covers/04.webp);height:280px;margin:0;padding:0"><div><small>Upcoming · 2 576 games</small><strong>Pre-order now</strong></div></a>`;
function closePops(except){
  ['#mega','#navPop','#regionPop','#sortPop'].forEach(s=>{if(s!==except)$(s).classList.remove('open')});
  $$('[aria-expanded=true][data-nav],#regionBtn,#sortBtn').forEach(b=>{if(!except||!b.dataset.owner||b.dataset.owner!==except)b.setAttribute('aria-expanded','false')});
}
function toggleNav(i,btn){
  const k=NAV[i][1]; if(!k) return;
  const wasOpen=btn.getAttribute('aria-expanded')==='true'; closePops();
  if(wasOpen) return; btn.setAttribute('aria-expanded','true');
  if(k===1){$('#mega').classList.add('open')} else {const p=$('#navPop'); p.innerHTML=k.map(x=>`<a class="mi" href="#">${x}</a>`).join('');
    const r=btn.getBoundingClientRect(), h=$('.hdr').getBoundingClientRect(); p.style.left=(r.left-h.left)+'px'; p.style.top=(r.bottom-h.top+8)+'px'; p.classList.add('open')}
}
const REGIONS=[['pt','Portugal'],['de','Germany'],['fr','France'],['es','Spain'],['it','Italy']];
let region='pt';
function renderRegion(){$('#regionPop').innerHTML=`<div style="padding:4px 8px 8px;color:var(--text-tertiary);font:600 12px/16px Geist,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em">Region · EUR</div>`+REGIONS.map(([c,n])=>`<button class="mi ${c===region?'on':''}" data-region="${c}" role="menuitemradio" aria-checked="${c===region}">${img(c,'flag')}&nbsp;${n}${ic('check','class="i chk"')}</button>`).join('')}
renderRegion();
$('#drawer').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="logo"><b>${ic('bolt')}</b>KEYVAULT</span><button class="btn btn-sec ib" data-close aria-label="Close menu">${ic('close')}</button></div>`+NAV.map(([l])=>`<a href="#">${l}${ic('chevron-right','style="color:var(--text-tertiary)"')}</a>`).join('')+`<hr><a href="#">Wishlist${ic('heart','style="color:var(--text-tertiary)"')}</a><a href="#">Account${ic('user','style="color:var(--text-tertiary)"')}</a><a href="#" id="dRegion">Portugal · EUR${ic('globe','style="color:var(--text-tertiary)"')}</a><hr><a href="#">Help center</a><a href="#">Sell on KeyVault</a>`;

/* ---------- Sheets ---------- */
let lastFocus=null;
function openSheet(id){lastFocus=document.activeElement;closePops();$('#scrim').classList.add('open');$(id).classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>{const b=$(id).querySelector('[data-close]');b&&b.focus()},50)}
function closeSheets(){['#fSheet','#sSheet','#drawer'].forEach(s=>$(s).classList.remove('open'));$('#scrim').classList.remove('open');document.body.style.overflow='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-close]'); if(!t){ if(!e.target.closest('.pop,.mega'))closePops(); return }
  const d=t.dataset;
  if(t.tagName==='A'&&t.getAttribute('href')==='#') e.preventDefault();
  if(d.nav!==undefined) return toggleNav(+d.nav,t);
  if(t.id==='regionBtn'){const o=$('#regionPop').classList.contains('open');closePops();if(!o){const r=t.getBoundingClientRect(),h=$('.hdr').getBoundingClientRect();const p=$('#regionPop');p.style.left=(r.left-h.left)+'px';p.style.top=(r.bottom-h.top+8)+'px';p.classList.add('open');t.setAttribute('aria-expanded','true')}return}
  if(d.region){region=d.region;const n=REGIONS.find(r=>r[0]===region)[1];$('#regionLbl').textContent=n+' · EUR';renderRegion();closePops();return toast('Prices shown for '+n)}
  if(t.id==='sortBtn'){const o=$('#sortPop').classList.contains('open');closePops();if(!o){$('#sortPop').classList.add('open');t.setAttribute('aria-expanded','true')}return}
  if(d.sort){S.sort=d.sort;S.page=1;closePops();render();if($('#sSheet').classList.contains('open'))setTimeout(closeSheets,150);return}
  if(d.view){S.view=d.view;return render()}
  if(t.id==='mView'){S.view=S.view==='grid'?'list':'grid';return render()}
  if(d.tog){const ctx=t.closest('#fMob')?'mob':'desk';S.open[ctx][d.tog]=!S.open[ctx][d.tog];return renderFilters()}
  if(d.more){S.more[d.more]=!S.more[d.more];return renderFilters()}
  if(d.preset){const [a,b]=d.preset.split('-').map(Number);S.price=(S.price[0]===a&&S.price[1]===b)?[0,PMAX]:[a,b];return update()}
  if(d.rm){const [g,v]=d.rm.split(':');if(g==='price')S.price=[0,PMAX];else if(g==='sw')S[v]=false;else S.sel[g].delete(v);return update()}
  if(d.act==='reset'){for(const g in S.sel)S.sel[g].clear();S.price=[0,PMAX];S.disc=S.instant=false;S.q='';$('#q').value='';S.fq={};return update()}
  if(d.page){S.page=+d.page;render();return $('.ttl').scrollIntoView({behavior:'smooth'})}
  if(d.wish){const id=+d.wish;S.wish.has(id)?S.wish.delete(id):S.wish.add(id);render();return toast(S.wish.has(id)?'Added to wishlist':'Removed from wishlist')}
  if(d.cart){const id=+d.cart;if(S.cart.has(id)){S.cart.delete(id);toast('Removed from cart')}else{S.cart.add(id);toast(GAMES[id].title+' added to cart')}return render()}
  if(t.id==='openFilters')return openSheet('#fSheet');
  if(t.id==='openSort')return openSheet('#sSheet');
  if(t.id==='menuBtn')return openSheet('#drawer');
  if(d.close!==undefined)return closeSheets();
  if(!t.closest('.pop,.mega'))closePops();
});
$('#scrim').addEventListener('click',closeSheets);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePops();closeSheets()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.g){t.checked?S.sel[d.g].add(t.value):S.sel[d.g].delete(t.value);return update()}
  if(d.sw){S[d.sw]=t.checked;return update()}
  if(d.p!==undefined){let v=Math.max(0,Math.min(PMAX,parseInt(t.value)||0));const i=+d.p;S.price[i]=v;if(S.price[0]>S.price[1])S.price=[Math.min(...S.price),Math.max(...S.price)];return update()}
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(t.id==='q'){S.q=t.value;S.page=1;return render()}
  if(d.fq!==undefined){S.fq[d.fq]=t.value;return renderFilters()}
  if(d.r!==undefined){const i=+d.r;let v=+t.value;if(i===0)v=Math.min(v,S.price[1]);else v=Math.max(v,S.price[0]);S.price[i]=v;
    const range=t.closest('.range');const fill=range.querySelector('.fill');fill.style.left=`calc(8px + ${S.price[0]/PMAX}*(100% - 16px))`;fill.style.right=`calc(8px + ${1-S.price[1]/PMAX}*(100% - 16px))`;
    range.parentElement.querySelectorAll('[data-p]').forEach(p=>p.value=S.price[+p.dataset.p]);S.page=1;render()}
});
document.addEventListener('pointerup',e=>{if(e.target.dataset&&e.target.dataset.r!==undefined)renderFilters()});
$('.panel').addEventListener('keyup',e=>{if(e.target.dataset.r!==undefined)renderFilters()});
let lastMob=innerWidth<1024;addEventListener('resize',()=>{const m=innerWidth<1024;if(m!==lastMob){lastMob=m;closePops();closeSheets();render()}});
hydrate();renderFilters();render();
</script>
</body>
</html>
